<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable — Absorption</title>
  <link rel="stylesheet" href="/css/auth.css" />
  <style>
    .error-container {
      text-align: center;
      padding: 3rem 2rem;
    }
    .error-code {
      font-size: 8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title { font-size: 1.8rem; font-weight: 700; margin-bottom: .5rem; }
    .error-msg   { color: var(--muted); margin-bottom: 2rem; }
    .error-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn-back {
      padding: .75rem 1.5rem; border-radius: 9px; font-weight: 600;
      text-decoration: none; transition: all .2s;
    }
    .btn-primary-link { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; }
    .btn-primary-link:hover { opacity: .9; transform: translateY(-1px); }
    .btn-outline-link { border: 2px solid rgba(255,255,255,.4); color: #fff; }
    .btn-outline-link:hover { background: rgba(255,255,255,.1); }
  </style>
</head>
<body>
  <div class="auth-layout" style="max-width:600px">
    <div class="auth-form-panel" style="flex:1">
      <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page introuvable</h1>
        <p class="error-msg">La page que vous cherchez n'existe pas ou a été déplacée.</p>
        <div class="error-actions">
          <a href="javascript:history.back()" class="btn-back btn-outline-link" style="border:2px solid var(--border);color:var(--text)">
            ← Retour
          </a>
          <a href="/user/dashboard.html" class="btn-back btn-primary-link">
            🏠 Accueil
          </a>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/theme.js"></script>
</body>
</html>
