<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Absorption</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-layout">
    <!-- Brand panel -->
    <div class="auth-brand-panel">
      <div class="logo">🔬</div>
      <h1>Absorption</h1>
      <p>Plateforme de gestion et de calcul d'absorption</p>
      <div class="features">
        <div class="feature-item"><span>✦</span><span>Calcul d'absorption en temps réel</span></div>
        <div class="feature-item"><span>✦</span><span>Historique de vos analyses</span></div>
        <div class="feature-item"><span>✦</span><span>Interface sécurisée</span></div>
      </div>
    </div>

    <!-- Form panel -->
    <div class="auth-form-panel">
      <h2>Bon retour 👋</h2>
      <p class="subtitle">Connectez-vous à votre compte</p>

      <div id="alert" class="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="vous@exemple.com" autocomplete="email" />
          <span class="field-error" id="emailErr"></span>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          <span class="field-error" id="passwordErr"></span>
        </div>
        <div style="text-align:right;margin-bottom:1.2rem">
          <a href="forgot-password.html" class="link-muted">Mot de passe oublié ?</a>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="spinner" id="spinner"></span>
          Se connecter
        </button>
      </form>

      <p class="auth-footer">
        Pas encore de compte ? <a href="signup.html">S'inscrire</a>
      </p>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/loading.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/particles.js"></script>
  <script src="/js/welcome.js"></script>
  <script>
    console.log("Page de connexion chargée");
    
    if (localStorage.getItem("access_token")) {
      const role = localStorage.getItem("user_role");
      window.location.href = role === "admin" ? "/admin/dashboard.html" : "/user/dashboard.html";
    }

    const form       = document.getElementById("loginForm");
    const alertEl    = document.getElementById("alert");
    const submitBtn  = document.getElementById("submitBtn");
    const spinner    = document.getElementById("spinner");
    const emailInput = document.getElementById("email");
    const pwInput    = document.getElementById("password");
    const emailErr   = document.getElementById("emailErr");
    const pwErr      = document.getElementById("passwordErr");

    console.log("Éléments DOM trouvés:", {
      form: !!form,
      alertEl: !!alertEl,
      submitBtn: !!submitBtn,
      emailInput: !!emailInput,
      pwInput: !!pwInput
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      console.log("Formulaire de connexion soumis");
      
      // Cacher les alertes précédentes
      if (alertEl) alertEl.className = "alert";
      
      // Nettoyer les erreurs de champs
      if (emailInput) emailInput.classList.remove("error");
      if (pwInput) pwInput.classList.remove("error");
      if (emailErr) emailErr.classList.remove("show");
      if (pwErr) pwErr.classList.remove("show");

      const email    = emailInput.value.trim();
      const password = pwInput.value;

      console.log("Email saisi:", email);
      console.log("Mot de passe saisi:", password ? "***" : "vide");

      // Validation simple
      if (!email) { 
        if (emailInput) emailInput.classList.add("error");
        if (emailErr) {
          emailErr.textContent = "Email requis";
          emailErr.classList.add("show");
        }
        return; 
      }
      if (!password) { 
        if (pwInput) pwInput.classList.add("error");
        if (pwErr) {
          pwErr.textContent = "Mot de passe requis";
          pwErr.classList.add("show");
        }
        return; 
      }

      console.log("Validation OK, envoi de la requête de connexion...");
      
      // Afficher le loading
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner show"></span>Connexion...';
      }
      
      try {
        console.log("Envoi vers:", "http://127.0.0.1:5000/api/auth/login");
        const response = await fetch("http://127.0.0.1:5000/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email,
            password: password
          })
        });
        
        console.log("Status de la réponse:", response.status);
        const data = await response.json();
        console.log("Données reçues:", data);
        
        // Cacher le loading
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Se connecter';
        }
        
        if (!response.ok) {
          const errorMsg = data?.message || "Erreur de connexion";
          console.error("Erreur de connexion:", errorMsg);
          
          if (alertEl) {
            alertEl.textContent = errorMsg;
            alertEl.className = "alert alert-error show";
          }
          return;
        }

        console.log("Connexion réussie!");
        const token = data.access_token;
        
        // Décoder le token JWT
        let payload = null;
        try {
          const payloadPart = token.split(".")[1];
          payload = JSON.parse(atob(payloadPart));
          console.log("Payload décodé:", payload);
        } catch (e) {
          console.error("Erreur décodage JWT:", e);
        }
        
        // Sauvegarder le token
        localStorage.setItem("access_token", token);
        localStorage.setItem("user_role", payload?.role || "user");

        // Afficher le succès
        if (alertEl) {
          alertEl.textContent = "Connexion réussie ! Redirection...";
          alertEl.className = "alert alert-success show";
        }

        // Redirection
        const userRole = payload?.role || "user";
        const redirectUrl = userRole === "admin" ? "/admin/dashboard.html" : "/user/dashboard.html";
        
        console.log("Redirection vers:", redirectUrl);
        
        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 1500);
        
      } catch (error) {
        console.error("Erreur lors de la requête de connexion:", error);
        
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Se connecter';
        }
        
        if (alertEl) {
          alertEl.textContent = "Erreur de connexion. Vérifiez que le serveur est démarré.";
          alertEl.className = "alert alert-error show";
        }
      }
    });
  </script>
</body>
</html>
