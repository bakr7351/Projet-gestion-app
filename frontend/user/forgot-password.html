<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot de passe oublié — Absorption</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-layout">
    <div class="auth-brand-panel">
      <div class="logo">🔑</div>
      <h1>Récupération</h1>
      <p>Nous vous enverrons un lien pour réinitialiser votre mot de passe</p>
    </div>

    <div class="auth-form-panel">
      <h2>Mot de passe oublié ?</h2>
      <p class="subtitle">Entrez votre email pour recevoir un lien de réinitialisation</p>

      <div id="alert" class="alert"></div>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="vous@exemple.com" />
          <span class="field-error" id="emailErr"></span>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="spinner" id="spinner"></span>
          Envoyer le lien
        </button>
      </form>

      <p class="auth-footer">
        <a href="login.html">← Retour à la connexion</a>
      </p>
    </div>
  </div>

  <script src="/js/theme.js"></script><script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/particles.js"></script>
  <script>
    const form       = document.getElementById("forgotForm");
    const alertEl    = document.getElementById("alert");
    const submitBtn  = document.getElementById("submitBtn");
    const spinner    = document.getElementById("spinner");
    const emailInput = document.getElementById("email");
    const emailErr   = document.getElementById("emailErr");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      clearFieldError(emailInput, emailErr);
      const email = emailInput.value.trim();
      if (!email) { showFieldError(emailInput, emailErr, "Email requis"); return; }
      setLoading(submitBtn, spinner, true);
      const res = await Auth.forgotPassword(email);
      setLoading(submitBtn, spinner, false);
      showAlert(alertEl, res?.data?.message || "Demande envoyée.", "success");
      form.reset();
    });
  </script>
</body>
</html>
