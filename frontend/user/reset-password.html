<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau mot de passe — Absorption</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-layout">
    <div class="auth-brand-panel">
      <div class="logo">🔒</div>
      <h1>Sécurité</h1>
      <p>Choisissez un mot de passe fort pour protéger votre compte</p>
    </div>

    <div class="auth-form-panel">
      <h2>Nouveau mot de passe</h2>
      <p class="subtitle">Choisissez un mot de passe sécurisé</p>

      <div id="alert" class="alert"></div>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label for="password">Nouveau mot de passe <small style="text-transform:none;font-weight:400">(min. 8 caractères)</small></label>
          <input type="password" id="password" placeholder="••••••••" oninput="checkStrength(this.value)" />
          <div id="strengthBar" style="height:5px;border-radius:3px;margin-top:6px;transition:all .3s;width:0"></div>
          <div id="strengthLabel" style="font-size:12px;margin-top:3px"></div>
          <span class="field-error" id="passwordErr"></span>
        </div>
        <div class="form-group">
          <label for="confirm">Confirmer</label>
          <input type="password" id="confirm" placeholder="••••••••" />
          <span class="field-error" id="confirmErr"></span>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="spinner" id="spinner"></span>
          Réinitialiser
        </button>
      </form>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/particles.js"></script>
  <script>
    // Fonction de vérification de la force du mot de passe (identique à signup.html)
    function checkStrength(pw) {
      const bar = document.getElementById("strengthBar");
      const label = document.getElementById("strengthLabel");
      if (!pw) { bar.style.width = "0"; label.textContent = ""; return; }
      let score = 0;
      if (pw.length >= 8)  score++;
      if (pw.length >= 12) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      if (score <= 2) {
        bar.style.cssText = "height:5px;border-radius:3px;margin-top:6px;transition:all .3s;width:33%;background:#ef4444";
        label.textContent = "Faible"; label.style.color = "#ef4444";
      } else if (score <= 3) {
        bar.style.cssText = "height:5px;border-radius:3px;margin-top:6px;transition:all .3s;width:66%;background:#f59e0b";
        label.textContent = "Moyen"; label.style.color = "#f59e0b";
      } else {
        bar.style.cssText = "height:5px;border-radius:3px;margin-top:6px;transition:all .3s;width:100%;background:#22c55e";
        label.textContent = "Fort ✓"; label.style.color = "#22c55e";
      }
    }

    const params    = new URLSearchParams(window.location.search);
    const token     = params.get("token") || "";
    const form      = document.getElementById("resetForm");
    const alertEl   = document.getElementById("alert");
    const submitBtn = document.getElementById("submitBtn");
    const spinner   = document.getElementById("spinner");

    console.log("Token récupéré:", token);
    console.log("URL de base API:", "http://127.0.0.1:5000/api");

    if (!token) {
      showAlert(alertEl, "Lien invalide ou expiré.", "error");
      submitBtn.disabled = true;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      console.log("Formulaire soumis");
      
      hideAlert(alertEl);
      const password = document.getElementById("password").value;
      const confirm  = document.getElementById("confirm").value;
      const pwErr    = document.getElementById("passwordErr");
      const cfErr    = document.getElementById("confirmErr");
      
      console.log("Mot de passe saisi:", password ? "***" : "vide");
      console.log("Confirmation saisie:", confirm ? "***" : "vide");
      
      clearFieldError(document.getElementById("password"), pwErr);
      clearFieldError(document.getElementById("confirm"), cfErr);
      
      if (password.length < 8) { 
        showFieldError(document.getElementById("password"), pwErr, "Minimum 8 caractères"); 
        return; 
      }
      if (password !== confirm) { 
        showFieldError(document.getElementById("confirm"), cfErr, "Les mots de passe ne correspondent pas"); 
        return; 
      }
      
      console.log("Validation OK, envoi de la requête...");
      setLoading(submitBtn, spinner, true);
      
      try {
        // Test direct de l'API avec fetch
        console.log("Envoi vers:", "http://127.0.0.1:5000/api/auth/reset-password");
        const response = await fetch("http://127.0.0.1:5000/api/auth/reset-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token: token,
            password: password
          })
        });
        
        console.log("Status de la réponse:", response.status);
        const data = await response.json();
        console.log("Données reçues:", data);
        
        setLoading(submitBtn, spinner, false);
        
        if (!response.ok) { 
          const errorMsg = data?.message || "Erreur de connexion au serveur";
          console.error("Erreur:", errorMsg);
          showAlert(alertEl, errorMsg, "error"); 
          return; 
        }
        
        console.log("Succès!");
        showAlert(alertEl, "Mot de passe réinitialisé. Redirection...", "success");
        setTimeout(() => window.location.href = "login.html", 2000);
        
      } catch (error) {
        console.error("Erreur lors de la requête:", error);
        setLoading(submitBtn, spinner, false);
        showAlert(alertEl, "Erreur de connexion. Vérifiez que le serveur est démarré.", "error");
      }
    });
  </script>
</body>
</html>
